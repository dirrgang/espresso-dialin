[tools]
python = "3.12"
uv = "0.12.13"
prek = "0.5.2"

[tasks.setup]
description = "Set up the development environment"
run = [
    "uv sync --locked --all-extras",
    "prek install",
]

[tasks.lint]
description = "Run Ruff lint and formatting checks"
run = [
    "uv run --locked --extra dev ruff check .",
    "uv run --locked --extra dev ruff format --check .",
]

[tasks.fix]
description = "Apply Ruff fixes and formatting"
run = [
    "uv run --locked --extra dev ruff check --fix .",
    "uv run --locked --extra dev ruff format .",
]

[tasks.typecheck]
description = "Run mypy"
run = "uv run --locked --extra dev mypy src"

[tasks.test]
description = "Run tests with coverage"
run = "uv run --locked --extra dev pytest --cov=espresso_dialin --cov-report=term-missing"

[tasks.check]
description = "Run all quality gates"
depends = ["lint", "typecheck", "test"]

[tasks.app]
description = "Run the local Streamlit app"
run = "uv run --locked streamlit run app.py --server.address 127.0.0.1"

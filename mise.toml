[tools]
python = "3.12"
uv = "0.12.13"
prek = "0.5.2"

[tasks.setup]
description = "Set up the development environment"
run = [
    "uv sync --locked --all-groups",
    "prek install",
]

[tasks.lint]
description = "Run Ruff lint and formatting checks"
run = [
    "uv run --locked ruff check .",
    "uv run --locked ruff format --check .",
]

[tasks.fix]
description = "Apply Ruff fixes and formatting"
run = [
    "uv run --locked ruff check --fix .",
    "uv run --locked ruff format .",
]

[tasks.typecheck]
description = "Run mypy and Pyright"
run = [
    "uv run --locked mypy src",
    "uv run --locked python scripts/run_pyright.py",
]

[tasks.test]
description = "Run tests with coverage"
run = "uv run --locked pytest --cov=espresso_dialin --cov-report=term-missing"

[tasks.check]
description = "Run all quality gates"
depends = ["lint", "typecheck", "test"]

[tasks.app]
description = "Run the local Streamlit app"
run = "uv run --locked streamlit run streamlit_app.py --server.address 127.0.0.1"

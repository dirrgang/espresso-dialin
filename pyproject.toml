[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "espresso-dialin"
version = "0.1.0"
description = "Experimental adaptive espresso dial-in proof of concept"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "nbqa>=1.9,<2",
    "pre-commit>=4,<5",
    "pyright[nodejs]>=1.1.405,<2",
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]
analysis = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/espresso_dialin"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["espresso_dialin"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
pretty = true
show_error_codes = true

[tool.pyright]
include = ["src", "tests", "scripts", "streamlit_app.py"]
exclude = ["data", "notebooks", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --locked --extra dev ruff check .

      - name: Check formatting
        run: uv run --locked --extra dev ruff format --check .

      - name: Type-check
        run: uv run --locked --extra dev mypy src

      - name: Test
        run: uv run --locked --extra dev pytest --cov=espresso_dialin --cov-report=term-missing

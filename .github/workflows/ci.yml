name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.14 quality
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Type-check
        run: uv run --no-sync mypy src

      - name: Test
        run: uv run --no-sync pytest --cov=espresso_dialin --cov-report=term-missing

  windows-app-smoke:
    name: Python 3.14 Windows app smoke
    runs-on: windows-latest
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked

      - name: Run Streamlit integration tests
        run: uv run --no-sync pytest tests/test_app.py
